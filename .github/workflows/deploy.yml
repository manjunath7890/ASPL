name: Build & Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: React_App/package-lock.json

      # ── 3. Build React App ─────────────────────────────────────────────────
      - name: Install React dependencies
        run: npm ci
        working-directory: React_App

      - name: Build React App (strips source maps)
        run: npm run build
        working-directory: React_App
        env:
          CI: false   # suppress React warnings-as-errors
          GENERATE_SOURCEMAP: false

      # ── 4. Copy React build → Node_App/build ──────────────────────────────
      - name: Copy React build into Node_App
        run: |
          rm -rf Node_App/build
          cp -r React_App/build Node_App/build
          echo "✅ React build copied to Node_App/build"
          ls -la Node_App/build

      # ── 5. Install Vercel CLI ─────────────────────────────────────────────
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # ── 6. Pull Vercel project settings ──────────────────────────────────
      - name: Pull Vercel environment & settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: Node_App

      # ── 7. Deploy to Vercel ───────────────────────────────────────────────
      #    On PRs: preview deployment (no --prod)
      #    On main push: production deployment (--prod)
      - name: Deploy Preview (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "Preview URL: $URL"
          echo "PREVIEW_URL=$URL" >> $GITHUB_ENV
        working-directory: Node_App

      - name: Deploy Production (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: Node_App

      # ── 8. Comment preview URL on PR ─────────────────────────────────────
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (url) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Preview deployment ready!**\n\n${url}`,
              });
            }
